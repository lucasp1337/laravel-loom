site_name: Laravel Loom
site_description: Static analyzer for Laravel's event-driven primitives — emits a deterministic JSON index.
site_url: https://lucasp1337.github.io/laravel-loom/
repo_url: https://github.com/lucasp1337/laravel-loom
repo_name: lucasp1337/laravel-loom
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts:
      - What Loom sees: concepts/what-loom-sees.md
      - The index: concepts/the-index.md
  - Guides:
      - Browse the UI: guides/browse-the-ui.md
      - Ask an agent: guides/ask-an-agent.md
      - Gate your CI: guides/gate-your-ci.md
      - Why was my code missed?: guides/why-was-my-code-missed.md
  - Reference:
      - Commands: reference/commands.md
      - Check rules and formats: reference/check-rules-and-formats.md
      - GitHub Action: reference/action.md
      - MCP tools: reference/mcp-tools.md
      - Schema: reference/schema.md
      - PHP API: reference/php-api.md
  - Upgrading: upgrading.md
