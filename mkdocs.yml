site_name: Laravel Loom
site_description: Static analyzer for Laravel's event-driven primitives — emits a deterministic JSON index.
site_url: https://lucasp1337.github.io/laravel-loom/
repo_url: https://github.com/lucasp1337/laravel-loom
repo_name: lucasp1337/laravel-loom
edit_uri: edit/main/docs/

docs_dir: docs

copyright: Laravel Loom · MIT licensed

theme:
  name: material
  variant: classic
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Literata
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/loom.css

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      extend_pygments_lang:
        # Snippets are fragments, so lex PHP without requiring an opening tag
        - name: php
          lang: php
          options:
            startinline: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts:
      - What Loom sees: concepts/what-loom-sees.md
      - The index: concepts/the-index.md
  - Guides:
      - Browse the UI: guides/browse-the-ui.md
      - Ask an agent: guides/ask-an-agent.md
      - Use with Laravel Boost: guides/use-with-boost.md
      - Gate your CI: guides/gate-your-ci.md
      - Why was my code missed?: guides/why-was-my-code-missed.md
  - Reference:
      - Commands: reference/commands.md
      - Check rules and formats: reference/check-rules-and-formats.md
      - GitHub Action: reference/action.md
      - MCP tools: reference/mcp-tools.md
      - Schema: reference/schema.md
      - PHP API: reference/php-api.md
      - UI config: reference/ui-config.md
      - What Loom detects: reference/what-loom-detects.md
  - Contributing:
      - Architecture: contributing/architecture.md
      - Class hierarchy: contributing/class-hierarchy.md
      - Add a scanner: contributing/add-a-scanner.md
      - Decision records: contributing/adr/README.md
