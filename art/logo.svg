<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Laravel Loom">
  <title>Laravel Loom</title>
  <!-- 5 vertical warps -->
  <line x1="14" y1="10" x2="14" y2="54" stroke="#1f2328" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="24" y1="10" x2="24" y2="54" stroke="#1f2328" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="32" y1="10" x2="32" y2="54" stroke="#1f2328" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="40" y1="10" x2="40" y2="54" stroke="#1f2328" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="50" y1="10" x2="50" y2="54" stroke="#1f2328" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Accent weft drawn over all warps -->
  <line x1="6" y1="32" x2="58" y2="32" stroke="#E8743B" stroke-width="3" stroke-linecap="round"/>
  <!-- Restore warps 2 and 4 over the weft so the weft reads as passing UNDER them: over-under-over-under-over -->
  <line x1="24" y1="28.6" x2="24" y2="35.4" stroke="#1f2328" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="40" y1="28.6" x2="40" y2="35.4" stroke="#1f2328" stroke-width="2.4" stroke-linecap="round"/>
</svg>
