<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" role="img" aria-label="Laravel Loom — Architecture as data">
  <title>Laravel Loom — Architecture as data</title>

  <!-- Shuttle Pass mark, scaled 56/64 from its native 64×64 viewBox into position (22, 12) -->
  <g transform="translate(22 12) scale(0.875)">
    <line x1="14" y1="10" x2="14" y2="54" stroke="#1f2328" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="24" y1="10" x2="24" y2="54" stroke="#1f2328" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="32" y1="10" x2="32" y2="54" stroke="#1f2328" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="40" y1="10" x2="40" y2="54" stroke="#1f2328" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="50" y1="10" x2="50" y2="54" stroke="#1f2328" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="6" y1="32" x2="58" y2="32" stroke="#E8743B" stroke-width="3" stroke-linecap="round"/>
    <line x1="24" y1="28.6" x2="24" y2="35.4" stroke="#1f2328" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="40" y1="28.6" x2="40" y2="35.4" stroke="#1f2328" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- Vertical divider -->
  <line x1="96" y1="18" x2="96" y2="62" stroke="#e3e0d4" stroke-width="1"/>

  <!-- Wordmark + tagline -->
  <g font-family='"Geist", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>
    <text x="115" y="45" font-size="28" font-weight="600" letter-spacing="-0.7" fill="#1f2328">
      <tspan font-weight="400" fill="#8a8a85">Laravel</tspan>
      <tspan dx="9">Loom</tspan>
    </text>
    <text x="115" y="63" font-family='"JetBrains Mono", "Fira Code", "Cascadia Code", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace' font-size="9.5" letter-spacing="1.5" fill="#8a8a85">ARCHITECTURE AS DATA</text>
  </g>
</svg>
