name: Verify

# Manual-only (workflow_dispatch), like the other workflows. See run-tests.yml
# for the rationale.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: '1.58.0'

      - run: just build

      - run: just install

      - run: just verify
